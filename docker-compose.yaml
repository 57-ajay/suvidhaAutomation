# json-file logs are unbounded by default; on a busy worker they filled the
# host disk until `docker compose down && up` became routine maintenance.
# Cap them on every service.
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "3"

services:
  redis-pivot:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-pivot-data:/data
    networks:
      - internal

  api:
    build: ./api
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    environment:
      REDIS_URL: redis://redis-pivot:6379
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/service.json
    volumes:
      - ${SERVICE_ACCOUNT_FILE:-./service.json}:/secrets/service.json:ro
    depends_on:
      - redis-pivot
    networks:
      internal:
      proxy:
        aliases:
          - pivot-api
    # ports: ["3000:3000"]

  worker:
    build: ./worker
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    environment:
      REDIS_URL: redis://redis-pivot:6379
      API_URL: http://api:3000
      # CAPTCHA_DEBUG_DIR: /tmp/captcha-debug
    # volumes:
      # - ./captcha-debug:/tmp/captcha-debug
    shm_size: "2gb"
    depends_on:
      - redis-pivot
      - api
    networks:
      internal:
      proxy:
        aliases:
          - pivot-worker
    # ports: ["6080:6080"]

networks:
  internal:
  proxy:
    external: true

volumes:
  redis-pivot-data:
