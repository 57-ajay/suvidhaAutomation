apiVersion: apps/v1
kind: Deployment
metadata: { name: worker }
spec:
  replicas: 1
  selector: { matchLabels: { app: worker } }
  template:
    metadata:
      labels: { app: worker }
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      serviceAccountName: worker-sa
      nodeSelector: { role: worker }
      tolerations:
        - { key: dedicated, operator: Equal, value: worker, effect: NoSchedule }
      terminationGracePeriodSeconds: 3600
      containers:
        - name: worker
          image: asia-south1-docker.pkg.dev/cabswale-ai/suvidha/worker:v15
          ports: [{ containerPort: 6080 }]
          envFrom: [{ secretRef: { name: suvidha-env } }]
          env:
            - { name: REDIS_URL, value: "redis://redis:6379" }
            - { name: API_URL, value: "http://api:3000" }
            # 4 slots <-> e2-highcpu-4 (4 vCPU / 4 GB, ~2.9 GB allocatable).
            # Challan jobs finish in 15-25s, so a burst is cheaper absorbed
            # here than by booting a node. Keep in lockstep with
            # target/listLength in scaledobject.yaml.
            - { name: MAX_SLOTS, value: "4" }
            - { name: DOMAIN, value: "gkep.cabswale.in" }
            - {
                name: POD_IP,
                valueFrom: { fieldRef: { fieldPath: status.podIP } },
              }
          volumeMounts: [{ name: dshm, mountPath: /dev/shm }]
          # No CPU limit: the pod can burst to the node's full 4 vCPU.
          # The memory request is below the limit on purpose: GKE daemonsets
          # book ~670Mi of the node's ~2.9GB allocatable, and a 2Gi request
          # left ~40Mi spare — one daemonset bump on a GKE upgrade and the
          # worker could never schedule. Nothing else lands on this tainted
          # node, so the gap is safe.
          resources:
            requests: { cpu: "2", memory: 1792Mi }
            limits: { memory: 2560Mi }
      volumes:
        # Memory-backed: counts against the 2560Mi limit above.
        - name: dshm
          emptyDir: { medium: Memory, sizeLimit: 512Mi }
