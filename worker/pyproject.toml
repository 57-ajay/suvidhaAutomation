# worker/pyproject.toml
[project]
name = "border-tax-pivot-a-worker"
version = "0.1.0"
description = "Pivot-a border-tax automation worker (Python + browser-use)"
requires-python = ">=3.12"
dependencies = [
    "browser-use>=0.7.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
]

[tool.uv]
# Lockfile is generated with `uv lock`; CI/Docker installs from it.

[tool.setuptools]
# Source lives under src/ but is run as a flat module set (see entrypoint),
# so we don't package it — uv just manages the environment.
py-modules = []
